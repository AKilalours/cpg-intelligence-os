[project]
name = "cpgos"
version = "0.1.0"
description = "CPG Intelligence OS: evidence-grounded AI for CPG financial operations and commercial planning"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "duckdb>=1.3,<3",  # 1.3+: lambda x: syntax; tested on 1.5.6 (Python 3.10) and 2.0.0 (3.12)
  "pillow>=11",      # invoice images: decoding and layout signatures
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cpgos*"]
