name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly: catch breaking dependency releases early

jobs:
  backend:
    # Locked versions on the oldest and newest supported Python. A DuckDB 2.0
    # break once reached users because only one Python version was tested.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CPGOS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pytest

  security-audit:
    # Fails on known vulnerabilities in the exact locked versions we ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - run: cd web && npm ci && npm audit --audit-level=high

  backend-latest-deps:
    # Unpinned newest releases. Allowed to fail: it is an early warning that
    # requirements.lock needs a deliberate update, not a broken build.
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CPGOS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade -e ".[dev]"
      - run: pip freeze | grep -iE "duckdb|psycopg|fastapi|pydantic"
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node lib/format.test.mjs
      - run: npm run typecheck
      - run: npm run build
