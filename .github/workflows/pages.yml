# The public, read-only copy of the app on GitHub Pages (free, no server, no card).
# Built from the same web/ code as the local app, reading the answers recorded in public-snapshot/
# (make public-snapshot). One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "public-snapshot/**", "scripts/build_public.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the public copy of the app
        run: bash scripts/build_public.sh public-snapshot /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .public-build/out
      - id: deployment
        uses: actions/deploy-pages@v4
